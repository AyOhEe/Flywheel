# Minecraft build dependency versions
minecraft_version = 1.21.5
neoforge_version = 21.5.31-beta
fabric_loader_version = 0.16.13
fabric_api_version = 0.119.9+1.21.5

# Build dependency mod versions
sodium_version = mc1.21.5-0.6.13
iris_version = 1.8.11+1.21.5

# Publication info
flywheel_group=dev.engine-room.flywheel
